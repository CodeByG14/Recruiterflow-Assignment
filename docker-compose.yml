services:
  # PostgreSQL Database Service
  postgres:
    image: postgres:16-alpine
    container_name: recruiterflow-db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      # Auto-run schema initialization on first startup
      - ./sql/recruiterflow_schema_backend.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      # Persist database data
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - recruiterflow-network

  # Database Seeding Service (runs once after postgres is healthy)
  seed:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: recruiterflow-seed
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Override DB_HOST to use docker service name
      DB_HOST: postgres
    command: ["python", "seed.py"]
    restart: "no"
    networks:
      - recruiterflow-network

  # FastAPI Backend Service
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: recruiterflow-backend
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Override DB_HOST to use docker service name
      DB_HOST: postgres
    ports:
      - "8000:8000"
    command: ["fastapi", "dev", "app/main.py", "--host", "0.0.0.0"]
    restart: unless-stopped
    networks:
      - recruiterflow-network

networks:
  recruiterflow-network:
    driver: bridge

volumes:
  postgres_data:
